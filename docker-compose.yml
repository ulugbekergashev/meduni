# Dev: PostgreSQL only. Redis/MinIO get added in whichever later session
# first needs a job queue or object storage (see CLAUDE.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meduni
      POSTGRES_USER: meduni
      POSTGRES_PASSWORD: meduni
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduni"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
