# Прод/сервер. Локальная dev-машина без Docker — см. docs/decisions/0001 и CLAUDE.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meduni
      POSTGRES_USER: meduni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduni"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meduni}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://meduni:${POSTGRES_PASSWORD}@postgres:5432/meduni
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?set in .env}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
